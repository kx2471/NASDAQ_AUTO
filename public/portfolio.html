<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 - NASDAQ AutoTrader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav a {
      padding: 10px 20px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .nav a:hover {
      background: #667eea;
      color: white;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .summary-item {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .symbol {
      font-weight: 700;
      color: #667eea;
      font-size: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-section input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }

    .auth-section small {
      color: #666;
      font-size: 12px;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">매매 입력</a>
      <a href="/portfolio.html" style="background: #667eea; color: white;">포트폴리오</a>
    </div>

    <div class="card">
      <h1>💼 나의 포트폴리오</h1>
      <p style="color: #666; margin-bottom: 20px;">현재 보유 주식 및 현금 현황</p>

      <!-- 인증 섹션 -->
      <div class="auth-section">
        <label for="token">GitHub Token</label>
        <input
          type="password"
          id="token"
          placeholder="ghp_xxxxxxxxxxxx"
        >
        <small>GitHub Personal Access Token (repo 권한 필요)</small>
      </div>

      <button onclick="loadPortfolio()" style="margin-bottom: 20px;">
        🔄 새로고침
      </button>

      <!-- 에러 메시지 -->
      <div id="error" style="display: none;" class="error"></div>

      <!-- 요약 -->
      <div id="summary" class="summary" style="display: none;">
        <div class="summary-item">
          <div class="summary-label">💵 현재 환율</div>
          <div class="summary-value" id="exchangeRate">-</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">💰 현금 잔고</div>
          <div class="summary-value" id="cashBalance">-</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">📊 보유 종목 수</div>
          <div class="summary-value" id="totalSymbols">-</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">📈 총 투자액</div>
          <div class="summary-value" id="totalInvested">-</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">💎 총 자산</div>
          <div class="summary-value" id="totalAssets">-</div>
        </div>
      </div>

      <!-- 보유 주식 목록 -->
      <div id="holdings" style="display: none;">
        <h3 style="margin: 30px 0 15px 0;">보유 주식</h3>
        <table>
          <thead>
            <tr>
              <th>종목</th>
              <th class="text-right">수량</th>
              <th class="text-right">평균 단가</th>
              <th class="text-right">총 투자액</th>
              <th class="text-right">총 투자액 (KRW)</th>
            </tr>
          </thead>
          <tbody id="holdingsBody">
          </tbody>
        </table>
      </div>

      <!-- 로딩 -->
      <div id="loading" class="loading">로딩 중...</div>
    </div>
  </div>

  <script>
    // 로컬 스토리지에서 토큰 불러오기
    const tokenInput = document.getElementById('token');
    const savedToken = localStorage.getItem('github_token');
    if (savedToken) {
      tokenInput.value = savedToken;
      loadPortfolio();
    }

    // 토큰 저장
    tokenInput.addEventListener('change', (e) => {
      localStorage.setItem('github_token', e.target.value);
    });

    // API URL
    const API_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:3000/api/portfolio'
      : '/api/portfolio';

    // 환율 조회 (캐시)
    let exchangeRate = null;
    let exchangeRateExpiry = null;

    async function getExchangeRate() {
      const now = Date.now();

      // 캐시가 유효한 경우 (5분)
      if (exchangeRate && exchangeRateExpiry && now < exchangeRateExpiry) {
        return exchangeRate;
      }

      try {
        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD', {
          timeout: 5000
        });
        const data = await response.json();

        if (data.rates && data.rates.KRW) {
          exchangeRate = data.rates.KRW;
          exchangeRateExpiry = now + (5 * 60 * 1000); // 5분 캐시
          return exchangeRate;
        }
      } catch (error) {
        console.error('환율 조회 실패:', error);
      }

      // 기본값
      exchangeRate = 1392;
      exchangeRateExpiry = now + (1 * 60 * 1000);
      return exchangeRate;
    }

    // 포트폴리오 로드
    async function loadPortfolio() {
      const token = tokenInput.value.trim();
      if (!token) {
        showError('GitHub Token을 입력해주세요');
        return;
      }

      // UI 초기화
      document.getElementById('error').style.display = 'none';
      document.getElementById('summary').style.display = 'none';
      document.getElementById('holdings').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || error.error);
        }

        const data = await response.json();
        displayPortfolio(data.portfolio);

      } catch (error) {
        showError(`오류: ${error.message}`);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    // 포트폴리오 표시
    async function displayPortfolio(portfolio) {
      // 환율 조회
      const rate = await getExchangeRate();

      // 요약 정보
      const cashKRW = portfolio.cash.balance * rate;
      const totalInvestedKRW = portfolio.summary.totalInvested * rate;
      const totalAssetsKRW = portfolio.summary.totalAssets * rate;

      // 환율 표시
      document.getElementById('exchangeRate').innerHTML = `
        ₩${rate.toFixed(2)}<br>
        <small style="opacity: 0.8; font-size: 14px;">KRW/USD</small>
      `;

      document.getElementById('cashBalance').innerHTML = `
        ${portfolio.cash.formatted}<br>
        <small style="opacity: 0.8; font-size: 14px;">₩${cashKRW.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</small>
      `;
      document.getElementById('totalSymbols').textContent = portfolio.summary.totalSymbols;
      document.getElementById('totalInvested').innerHTML = `
        $${portfolio.summary.totalInvested.toFixed(2)}<br>
        <small style="opacity: 0.8; font-size: 14px;">₩${totalInvestedKRW.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</small>
      `;
      document.getElementById('totalAssets').innerHTML = `
        $${portfolio.summary.totalAssets.toFixed(2)}<br>
        <small style="opacity: 0.8; font-size: 14px;">₩${totalAssetsKRW.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</small>
      `;
      document.getElementById('summary').style.display = 'grid';

      // 보유 주식
      const holdingsBody = document.getElementById('holdingsBody');
      holdingsBody.innerHTML = '';

      if (portfolio.holdings.length === 0) {
        holdingsBody.innerHTML = '<tr><td colspan="5" class="text-center" style="color: #999;">보유 주식이 없습니다</td></tr>';
      } else {
        portfolio.holdings.forEach(holding => {
          const krw = holding.totalCost * rate;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><span class="symbol">${holding.symbol}</span></td>
            <td class="text-right">${holding.formatted.qty}</td>
            <td class="text-right">${holding.formatted.avgPrice}</td>
            <td class="text-right">${holding.formatted.totalCost}</td>
            <td class="text-right">₩${krw.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
          `;
          holdingsBody.appendChild(row);
        });
      }

      document.getElementById('holdings').style.display = 'block';
    }

    // 에러 표시
    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }
  </script>
</body>
</html>
