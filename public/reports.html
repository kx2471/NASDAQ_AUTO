<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보고서 - NASDAQ AutoTrader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .nav a {
      padding: 10px 20px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .nav a:hover {
      background: #667eea;
      color: white;
    }

    .nav a.active {
      background: #667eea;
      color: white;
    }

    .auth-section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-section input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }

    .auth-section small {
      color: #666;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background: #6c757d;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .report-list {
      margin-top: 20px;
    }

    .report-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s;
    }

    .report-item:hover {
      background: #e9ecef;
    }

    .report-name {
      font-weight: 600;
      color: #333;
    }

    .report-date {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .report-actions button {
      padding: 8px 16px;
      font-size: 12px;
      margin-left: 8px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .report-content {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab:hover {
      color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">매매 입력</a>
      <a href="/portfolio.html">포트폴리오</a>
      <a href="/reports.html" class="active">보고서</a>
    </div>

    <div class="card">
      <h1>📊 AI 투자 보고서</h1>
      <p style="color: #666; margin-bottom: 20px;">Weekly Agent 및 Manager Agent 보고서 생성 및 조회</p>

      <!-- 인증 섹션 -->
      <div class="auth-section">
        <label for="token">GitHub Token</label>
        <input
          type="password"
          id="token"
          placeholder="ghp_xxxxxxxxxxxx"
        >
        <small>GitHub Personal Access Token (repo + workflow 권한 필요)</small>
      </div>

      <!-- 메시지 -->
      <div id="message" class="message"></div>

      <!-- 액션 버튼 -->
      <div class="actions">
        <button onclick="generateReport('weekly')" id="weeklyBtn">
          📈 Weekly Agent 보고서 생성
        </button>
        <button onclick="generateReport('manager')" id="managerBtn">
          🏢 Manager Agent 보고서 생성
        </button>
        <button onclick="loadReports()" class="secondary">
          🔄 보고서 목록 새로고침
        </button>
      </div>

      <!-- 탭 -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('weekly')">Weekly Agent 보고서</button>
        <button class="tab" onclick="switchTab('manager')">Manager Agent 보고서</button>
        <button class="tab" onclick="switchTab('all')">전체 보고서</button>
      </div>

      <!-- Weekly 탭 -->
      <div id="weekly-tab" class="tab-content active">
        <h3>Weekly Agent 보고서</h3>
        <div id="weeklyReports" class="loading">로딩 중...</div>
      </div>

      <!-- Manager 탭 -->
      <div id="manager-tab" class="tab-content">
        <h3>Manager Agent 보고서</h3>
        <div id="managerReports" class="loading">로딩 중...</div>
      </div>

      <!-- 전체 탭 -->
      <div id="all-tab" class="tab-content">
        <h3>전체 보고서</h3>
        <div id="allReports" class="loading">로딩 중...</div>
      </div>

      <!-- 보고서 내용 표시 영역 -->
      <div id="reportContent" style="display: none;">
        <h3 id="reportTitle"></h3>
        <button onclick="closeReport()" class="secondary">닫기</button>
        <div id="reportText" class="report-content"></div>
      </div>
    </div>
  </div>

  <script>
    // 로컬 스토리지에서 토큰 불러오기
    const tokenInput = document.getElementById('token');
    const savedToken = localStorage.getItem('github_token');
    if (savedToken) {
      tokenInput.value = savedToken;
      loadReports();
    }

    // 토큰 저장
    tokenInput.addEventListener('change', (e) => {
      localStorage.setItem('github_token', e.target.value);
    });

    // API URL
    const API_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:3000/api/report'
      : '/api/report';

    // 메시지 표시
    function showMessage(text, type = 'success') {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';

      if (type === 'success' || type === 'info') {
        setTimeout(() => {
          messageEl.style.display = 'none';
        }, 5000);
      }
    }

    // 탭 전환
    function switchTab(tab) {
      // 모든 탭 비활성화
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      // 선택한 탭 활성화
      event.target.classList.add('active');
      document.getElementById(`${tab}-tab`).classList.add('active');
    }

    // 보고서 생성
    async function generateReport(type) {
      const token = tokenInput.value.trim();
      if (!token) {
        showMessage('GitHub Token을 입력해주세요', 'error');
        return;
      }

      const btn = type === 'weekly' ? document.getElementById('weeklyBtn') : document.getElementById('managerBtn');
      btn.disabled = true;
      btn.textContent = '생성 중...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ type })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || error.error);
        }

        const data = await response.json();
        showMessage(data.message, 'success');

        // 10초 후 목록 새로고침
        setTimeout(() => {
          showMessage('보고서 목록을 확인하세요. GitHub Actions에서 실행 중입니다.', 'info');
        }, 5000);

      } catch (error) {
        showMessage(`오류: ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = type === 'weekly' ? '📈 Weekly Agent 보고서 생성' : '🏢 Manager Agent 보고서 생성';
      }
    }

    // 보고서 목록 로드
    async function loadReports() {
      const token = tokenInput.value.trim();
      if (!token) {
        showMessage('GitHub Token을 입력해주세요', 'error');
        return;
      }

      // 로딩 표시
      document.getElementById('weeklyReports').innerHTML = '<div class="loading">로딩 중...</div>';
      document.getElementById('managerReports').innerHTML = '<div class="loading">로딩 중...</div>';
      document.getElementById('allReports').innerHTML = '<div class="loading">로딩 중...</div>';

      try {
        const response = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || error.error);
        }

        const data = await response.json();
        displayReports(data.reports);

      } catch (error) {
        showMessage(`오류: ${error.message}`, 'error');
      }
    }

    // 보고서 목록 표시
    function displayReports(reports) {
      displayReportList('weeklyReports', reports.weekly);
      displayReportList('managerReports', reports.manager);
      displayReportList('allReports', reports.all);
    }

    function displayReportList(elementId, reports) {
      const container = document.getElementById(elementId);

      if (reports.length === 0) {
        container.innerHTML = '<p style="color: #999;">보고서가 없습니다.</p>';
        return;
      }

      container.innerHTML = reports.map(report => `
        <div class="report-item">
          <div>
            <div class="report-name">${report.name}</div>
            <div class="report-date">${formatDate(report.name)}</div>
          </div>
          <div class="report-actions">
            <button onclick="viewReport('${report.path}', '${report.name}')">📄 보기</button>
            <button onclick="downloadReport('${report.url}', '${report.name}')" class="secondary">💾 다운로드</button>
          </div>
        </div>
      `).join('');
    }

    // 날짜 포맷
    function formatDate(filename) {
      const match = filename.match(/(\d{8})/);
      if (match) {
        const date = match[1];
        return `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}`;
      }
      return '';
    }

    // 보고서 보기
    async function viewReport(path, name) {
      const token = tokenInput.value.trim();

      document.getElementById('reportContent').style.display = 'block';
      document.getElementById('reportTitle').textContent = name;
      document.getElementById('reportText').innerHTML = '<div class="loading">로딩 중...</div>';

      try {
        const response = await fetch(`${API_URL}?file=${encodeURIComponent(path)}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error('보고서를 불러올 수 없습니다.');
        }

        const data = await response.json();
        document.getElementById('reportText').textContent = data.content;

        // 스크롤
        document.getElementById('reportContent').scrollIntoView({ behavior: 'smooth' });

      } catch (error) {
        document.getElementById('reportText').textContent = `오류: ${error.message}`;
      }
    }

    // 보고서 다운로드
    function downloadReport(url, name) {
      window.open(url, '_blank');
    }

    // 보고서 닫기
    function closeReport() {
      document.getElementById('reportContent').style.display = 'none';
    }
  </script>
</body>
</html>
