<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASDAQ AutoTrader - 매매 입력</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .auth-section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-section small {
      color: #666;
      font-size: 12px;
    }

    .trades-list {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #e0e0e0;
    }

    .trade-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trade-item.buy {
      border-left: 4px solid #28a745;
    }

    .trade-item.sell {
      border-left: 4px solid #dc3545;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 NASDAQ AutoTrader</h1>
    <p class="subtitle">어디서나 매매 입력하기</p>

    <!-- 인증 섹션 -->
    <div class="auth-section">
      <label for="token">GitHub Token</label>
      <input
        type="password"
        id="token"
        placeholder="ghp_xxxxxxxxxxxx"
        value=""
      >
      <small>GitHub Personal Access Token (repo 권한 필요)</small>
    </div>

    <!-- 매매 입력 폼 -->
    <form id="tradeForm">
      <div class="form-group">
        <label for="symbol">종목 코드</label>
        <input
          type="text"
          id="symbol"
          name="symbol"
          placeholder="AAPL"
          required
          style="text-transform: uppercase"
        >
      </div>

      <div class="row">
        <div class="form-group">
          <label for="side">매매 구분</label>
          <select id="side" name="side" required>
            <option value="BUY">매수 (BUY)</option>
            <option value="SELL">매도 (SELL)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="qty">수량</label>
          <input
            type="number"
            id="qty"
            name="qty"
            placeholder="10"
            step="0.01"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="price">가격 ($)</label>
        <input
          type="number"
          id="price"
          name="price"
          placeholder="180.50"
          step="0.01"
          required
        >
      </div>

      <div class="form-group">
        <label for="note">메모 (선택사항)</label>
        <textarea
          id="note"
          name="note"
          rows="2"
          placeholder="거래 메모..."
        ></textarea>
      </div>

      <button type="submit" id="submitBtn">
        거래 추가
      </button>
    </form>

    <!-- 메시지 영역 -->
    <div id="message" class="message"></div>

    <!-- 최근 거래 목록 -->
    <div class="trades-list">
      <h3>최근 거래 내역</h3>
      <div id="tradesList" class="loading">로딩 중...</div>
    </div>
  </div>

  <script>
    // 로컬 스토리지에서 토큰 불러오기
    const tokenInput = document.getElementById('token');
    const savedToken = localStorage.getItem('github_token');
    if (savedToken) {
      tokenInput.value = savedToken;
    }

    // 토큰 저장
    tokenInput.addEventListener('change', (e) => {
      localStorage.setItem('github_token', e.target.value);
    });

    // API 기본 URL
    const API_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:3000/api/trades'
      : '/api/trades';

    // 메시지 표시
    function showMessage(text, type = 'success') {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';

      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    // 거래 목록 로드
    async function loadTrades() {
      const token = tokenInput.value.trim();
      if (!token) {
        document.getElementById('tradesList').innerHTML =
          '<small style="color: #999;">GitHub Token을 입력하세요</small>';
        return;
      }

      try {
        const response = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error('거래 내역을 불러올 수 없습니다');
        }

        const data = await response.json();
        const trades = data.trades.slice(-5).reverse(); // 최근 5개만

        if (trades.length === 0) {
          document.getElementById('tradesList').innerHTML =
            '<small style="color: #999;">거래 내역이 없습니다</small>';
          return;
        }

        const html = trades.map(trade => `
          <div class="trade-item ${trade.side.toLowerCase()}">
            <div>
              <strong>${trade.symbol}</strong>
              <small style="color: #666;"> ${trade.side} ${trade.qty}주 @ $${trade.price}</small>
            </div>
            <div style="text-align: right; font-size: 12px; color: #999;">
              ${new Date(trade.traded_at).toLocaleDateString('ko-KR')}
            </div>
          </div>
        `).join('');

        document.getElementById('tradesList').innerHTML = html;

      } catch (error) {
        document.getElementById('tradesList').innerHTML =
          `<small style="color: #dc3545;">${error.message}</small>`;
      }
    }

    // 폼 제출
    document.getElementById('tradeForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const token = tokenInput.value.trim();
      if (!token) {
        showMessage('GitHub Token을 입력해주세요', 'error');
        return;
      }

      const formData = new FormData(e.target);
      const trade = {
        symbol: formData.get('symbol').toUpperCase(),
        side: formData.get('side'),
        qty: parseFloat(formData.get('qty')),
        price: parseFloat(formData.get('price')),
        note: formData.get('note') || ''
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '처리 중...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(trade)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || error.error);
        }

        const result = await response.json();
        showMessage(`✅ 거래 추가 완료: ${result.trade.symbol} ${result.trade.side}`, 'success');

        // 폼 초기화
        e.target.reset();

        // 거래 목록 새로고침
        await loadTrades();

      } catch (error) {
        showMessage(`❌ 오류: ${error.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '거래 추가';
      }
    });

    // 페이지 로드 시 거래 목록 로드
    tokenInput.addEventListener('input', loadTrades);
    loadTrades();
  </script>
</body>
</html>
