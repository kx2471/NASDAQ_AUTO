name: Daily Stock Report Scheduler

# KST 16:00 = UTC 07:00 (평일에만 실행)
on:
  schedule:
    - cron: '0 7 * * 2-6'  # 화-토 UTC 07:00 (한국 평일)
  workflow_dispatch:  # 수동 실행 허용

jobs:
  schedule-daily-tasks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: dev  # dev 브랜치에서 실행

    - name: Display current time (KST)
      run: |
        echo "현재 시각 (KST): $(TZ=Asia/Seoul date)"
        echo "현재 시각 (UTC): $(date -u)"

    - name: Schedule daily tasks
      run: |
        # 스케줄링 작업만 수행 (실제 보고서 생성은 daily-report.yml에서)
        echo "📅 데일리 스케줄러 실행 중..."
        echo "⏰ 현재 시각: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S KST')"
        echo "✅ 스케줄링 작업 완료 - 보고서 생성은 별도 워크플로우에서 처리됩니다"
        echo "ℹ️ 실제 리포트 생성: daily-report.yml 워크플로우 참조"

    - name: Schedule completed
      run: |
        echo "📅 데일리 스케줄링 작업 완료"
        echo "ℹ️ 실제 보고서 생성은 daily-report.yml 워크플로우에서 처리됩니다"

    - name: Completion notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 일일 보고서 작업 성공적으로 완료"
        else
          echo "❌ 일일 보고서 작업 실패"
        fi