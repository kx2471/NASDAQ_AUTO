name: Daily Stock Report Scheduler

# KST 16:00 = UTC 07:00 (평일에만 실행)
on:
  schedule:
    - cron: '0 7 * * 2-6'  # 화-토 UTC 07:00 (한국 평일)
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write
  actions: write

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Display current time (KST)
      run: |
        echo "현재 시각 (KST): $(TZ=Asia/Seoul date)"
        echo "현재 시각 (UTC): $(date -u)"

    - name: Generate daily reports
      env:
        PORT: ${{ secrets.PORT }}
        API_KEY: ${{ secrets.API_KEY }}
        NODE_ENV: production
        BASE_URL: ${{ secrets.BASE_URL }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        ENABLE_GEMINI_REPORT: ${{ secrets.ENABLE_GEMINI_REPORT }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        REPORT_LOOKBACK_DAYS: ${{ secrets.REPORT_LOOKBACK_DAYS }}
        MARKET_TZ: ${{ secrets.MARKET_TZ }}
        SEND_TZ: ${{ secrets.SEND_TZ }}
        SEND_HOUR_LOCAL: ${{ secrets.SEND_HOUR_LOCAL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        ENABLE_SUPABASE_MIGRATION: false
        BACKUP_JSON_FILES: ${{ secrets.BACKUP_JSON_FILES }}
        USD_KRW_RATE: ${{ secrets.USD_KRW_RATE || '1391.7' }}
      run: |
        # 데이터 디렉터리 생성
        mkdir -p data/json data/screening data/report data/agent_reports

        # 데일리 파이프라인 실행
        echo "🚀 데일리 파이프라인 실행 중..."
        node --no-deprecation -e "
        const { runDaily } = require('./dist/jobs/daily.js');
        runDaily()
          .then(() => {
            console.log('✅ Daily pipeline completed successfully');
            process.exit(0);
          })
          .catch((error) => {
            console.error('❌ Daily pipeline failed:', error);
            process.exit(1);
          });
        "

    - name: Update repository and commit report
      run: |
        # 최신 상태로 업데이트
        git fetch origin main
        git reset --hard origin/main

        # 리포트 파일만 다시 추가
        git add data/

        # 변경사항이 있는 경우에만 커밋
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Daily)"
          git commit -m "📊 Daily report generated - $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S KST')"

          # 안전한 push (충돌 시 3번 재시도)
          for i in {1..3}; do
            if git push origin main; then
              echo "✅ Daily report push successful on attempt $i"
              break
            else
              echo "⚠️ Daily report push failed on attempt $i, retrying..."
              git fetch origin main
              git rebase origin/main
              sleep 2
            fi
          done
        fi

    - name: Completion notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 일일 보고서 작업 성공적으로 완료"
        else
          echo "❌ 일일 보고서 작업 실패"
        fi