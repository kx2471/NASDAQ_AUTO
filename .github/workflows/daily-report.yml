name: Weekly Stock Report

on:
  schedule:
    # 매주 월요일 KST 15:00 (UTC 06:00)에 실행 - Agent 리포트 생성
    - cron: '0 6 * * 1'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write
  actions: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # main 브랜치에서 실행
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build TypeScript
      run: npm run build

    - name: Generate weekly agent reports
      env:
        PORT: ${{ secrets.PORT }}
        API_KEY: ${{ secrets.API_KEY }}
        NODE_ENV: production
        BASE_URL: ${{ secrets.BASE_URL }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        ENABLE_GEMINI_REPORT: ${{ secrets.ENABLE_GEMINI_REPORT }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        REPORT_LOOKBACK_DAYS: ${{ secrets.REPORT_LOOKBACK_DAYS }}
        MARKET_TZ: ${{ secrets.MARKET_TZ }}
        SEND_TZ: ${{ secrets.SEND_TZ }}
        SEND_HOUR_LOCAL: ${{ secrets.SEND_HOUR_LOCAL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        ENABLE_SUPABASE_MIGRATION: false
        BACKUP_JSON_FILES: ${{ secrets.BACKUP_JSON_FILES }}
      run: |
        # 데이터 디렉터리 생성
        mkdir -p data/json data/screening data/report data/agent_reports
        
        # 주간 Agent 리포트 실행 (15:00)
        node --no-deprecation -e "
        const { runWeekly } = require('./dist/jobs/weekly.js');
        runWeekly()
          .then(() => {
            console.log('✅ Weekly agent reports generation completed successfully');
            process.exit(0);
          })
          .catch((error) => {
            console.error('❌ Weekly agent reports generation failed:', error);
            process.exit(1);
          });
        "
      
    - name: Update repository and commit report
      run: |
        # 최신 변경사항 가져오기
        git fetch origin main

        # 최신 상태로 동기화 (충돌 시 자동 병합)
        git pull origin main --no-edit --strategy-option=theirs || echo "Pull conflict, will resolve during push"

        # 리포트 파일 추가
        git add data/

        # 변경사항이 있는 경우에만 커밋
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "📊 Weekly agent reports - $(date +'%Y-%m-%d %H:%M:%S KST')"

        # main 브랜치에 push (충돌 시 3번 재시도)
        for i in {1..3}; do
          if git push origin main; then
            echo "✅ Push to main successful on attempt $i"
            echo "🚀 Vercel will now deploy the updated reports"
            break
          else
            echo "⚠️ Push to main failed on attempt $i, retrying..."
            git fetch origin main
            git pull origin main --no-edit --strategy-option=theirs
            sleep 2
          fi
        done
