name: Manager Agent Report

on:
  schedule:
    # 매주 월요일 KST 15:30 (UTC 06:30)에 실행 - Agent 리포트 30분 후
    - cron: '30 6 * * 1'
  workflow_dispatch: # 수동 실행 가능
    inputs:
      delay_minutes:
        description: 'Agent 리포트 완료 대기 시간 (분)'
        required: false
        default: '60'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  generate-manager-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: dev  # dev 브랜치에서 실행
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build TypeScript
      run: npm run build

    - name: Wait for Agent reports completion
      run: |
        # 수동 실행 시 지연 시간 적용
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          DELAY_MINUTES=${{ github.event.inputs.delay_minutes || '60' }}
          echo "⏰ Agent 리포트 완료 대기: ${DELAY_MINUTES}분"
          sleep $((DELAY_MINUTES * 60))
        else
          echo "📅 스케줄 실행: 15:00 Agent 리포트가 완료되었다고 가정"
        fi
      
    - name: Generate Manager Agent report
      env:
        PORT: ${{ secrets.PORT }}
        API_KEY: ${{ secrets.API_KEY }}
        NODE_ENV: production
        BASE_URL: ${{ secrets.BASE_URL }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        ENABLE_GEMINI_REPORT: ${{ secrets.ENABLE_GEMINI_REPORT }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        REPORT_LOOKBACK_DAYS: ${{ secrets.REPORT_LOOKBACK_DAYS }}
        MARKET_TZ: ${{ secrets.MARKET_TZ }}
        SEND_TZ: ${{ secrets.SEND_TZ }}
        SEND_HOUR_LOCAL: ${{ secrets.SEND_HOUR_LOCAL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        ENABLE_SUPABASE_MIGRATION: false
        BACKUP_JSON_FILES: ${{ secrets.BACKUP_JSON_FILES }}
      run: |
        # 데이터 디렉터리 생성
        mkdir -p data/json data/screening data/report
        
        # Manager_Agent 통합 리포트 실행 (15:30)
        node --no-deprecation -e "
        const { runManager } = require('./dist/jobs/manager.js');
        runManager()
          .then(() => {
            console.log('✅ Manager Agent integration completed successfully');
            process.exit(0);
          })
          .catch((error) => {
            console.error('❌ Manager Agent integration failed:', error);
            process.exit(1);
          });
        "
      
    - name: Update repository and commit final report
      run: |
        # 최신 상태로 업데이트 (dev 브랜치)
        git fetch origin dev
        git reset --hard origin/dev
        
        # Manager 리포트 파일만 다시 추가
        git add data/
        
        # 변경사항이 있는 경우에만 커밋
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Manager)"
          git commit -m "🏢 Manager Agent final report - $(date +'%Y-%m-%d %H:%M:%S KST')"
          
          # 안전한 push (충돌 시 3번 재시도)
          for i in {1..3}; do
            if git push origin dev; then
              echo "✅ Manager report push successful on attempt $i"
              break
            else
              echo "⚠️ Manager report push failed on attempt $i, retrying..."
              git fetch origin dev
              git rebase origin/dev
              sleep 2
            fi
          done
        fi