[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasdaq-auto"
version = "2.0.0"
description = "AI-Powered Stock Analysis & Portfolio Management System"
authors = [{name = "Nasdaq Auto Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["stock", "nasdaq", "trading", "ai", "portfolio", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/kx2471/NASDAQ_AUTO"
Repository = "https://github.com/kx2471/NASDAQ_AUTO.git"
Issues = "https://github.com/kx2471/NASDAQ_AUTO/issues"

[project.scripts]
nasdaq-auto = "nasdaq_auto.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"